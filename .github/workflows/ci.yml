name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install (CPU torch is fine for CI)
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Tests (exit code 5 = no tests collected yet; allowed during scaffold phase)
        run: uv run pytest -m "not gpu and not network" || [ $? -eq 5 ]
