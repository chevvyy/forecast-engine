# The self-improvement loop reads everything from this file. Workers pick up edits on their next pull.
branch: loop

data:
  source: auto             # daily bars: Alpaca if the worker has keys in .env, else keyless Yahoo
  interval: 1d
  start: "2016-01-04"      # Alpaca's first day; the same start for both sources keeps folds aligned
  end: "2026-11-25"        # last bar used (inclusive). Pinned so new daily bars cannot move the folds
                           # under a running comparison; move it only together with eval.version
  benchmark: SPY
  symbols: [SPY, QQQ, IWM, DIA, XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLU, XLB, XLRE, XLC,
            AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, JPM, V, UNH, XOM, JNJ, PG, HD, COST,
            AVGO, LLY, MA, WMT, BAC]
  symbols_file: configs/data/universe_wide.txt   # 539 symbols (since eval.version 2); the list above is part of it
  universe_note: "current index members and megacaps: survivorship bias, return skill is optimistic"

task:
  horizons: [1, 5, 20]     # bars ahead
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  max_lookback: 256        # fixes the first usable row so every job sees identical folds

eval:
  version: 2               # 2 = wide universe + data.end pin (2026-11-26); 1 = 35 symbols. Bump when folds, baselines or metrics change; old scores stop competing
  holdout_frac: 0.08       # most recent slice; no loop job may ever build rows from it
  n_folds: 3
  val_frac: 0.08
  embargo_bars: 5
  es_frac: 0.1

train:
  batch_size: 512
  max_epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  grad_clip: 1.0
  distill_alpha: 0.5

# A tier is a deployment budget, not a parameter target. A run only counts for a tier if it fits.
tiers:
  nano:      # any phone, CPU only
    max_params: 200000
    max_onnx_bytes: 1000000
    max_cpu_ms: 20
    min_vram_gb: 0
    max_minutes: 15
    model: {lookback: 64, patch: 4, stride: 2, d_model: 24, n_blocks: 2, kernel: 9, ffn: 2, dropout: 0.1}
  mid:       # mid-tier PC, 8 GB VRAM
    max_train_vram_gb: 7
    min_vram_gb: 2
    max_minutes: 30
    model: {lookback: 128, patch: 4, stride: 2, d_model: 128, n_blocks: 4, kernel: 25, ffn: 2, dropout: 0.15}
  large:     # RTX 5070 Ti, 16 GB VRAM
    max_train_vram_gb: 14
    min_vram_gb: 6
    max_minutes: 60
    model: {lookback: 256, patch: 8, stride: 4, d_model: 384, n_blocks: 8, kernel: 51, ffn: 4, dropout: 0.2}

# Used by workers to invent their own next experiment when the queue is empty.
search:
  d_model: {nano: [16, 24, 32, 48], mid: [64, 96, 128, 192, 256], large: [256, 384, 512, 768]}
  n_blocks: {nano: [1, 2, 3], mid: [2, 3, 4, 6], large: [4, 6, 8, 12]}
  kernel: [5, 9, 15, 25, 51]
  lookback: {nano: [32, 64, 128], mid: [64, 128, 256], large: [128, 256]}
  patch: [[2, 1], [4, 2], [8, 4], [16, 8]]
  ffn: [1, 2, 4]
  dropout: [0.0, 0.1, 0.2, 0.3]
  lr: [0.0003, 0.001, 0.003]
  weight_decay: [0.0, 0.0001, 0.001, 0.01]
  batch_size: [256, 512, 1024, 2048]
  prune_sparsity: [0.3, 0.5, 0.7, 0.85]
  # Share of self-invented jobs that distil / prune. Each such job now carries a seed and a configuration
  # is run at most 3 times (worker.MAX_REPEATS), so the 2026-11-26 lowering to 0.1 / 0.05 is undone for
  # prune. Distil stays low while no bigger tier's champion scores above the smaller tier's.
  p_distill: 0.1
  p_prune: 0.15
  # Before a worker mutates a tier's champion it re-runs the champion's own configuration until it has
  # this many seeds (worker.rerun): the champion is the best single run, so the luckiest seed. 1 = off.
  confirm_seeds: 3
  # A configuration with that many seeds takes its tier (becomes what workers mutate, distil from and
  # prune) only if its seed mean beats the holder's by more than this many standard errors of the
  # difference, with the tier's median seed sd as the noise (leaderboard.promoted). The best single run
  # is still shown as champion. confirm_seeds: 1 switches this off together with the re-runs.
  promote_z: 2.0
  # Share of self-invented jobs a worker gives to another track (configs/<name>.yaml), if it can load
  # that track's bars (minute bars need Alpaca keys in .env; a worker without them stays daily). The job
  # is invented from that track's own champions and `search` grid and scored on its own board. By count,
  # not by time: a minute job takes about half a minute, a daily one 2 to 30.
  tracks: {loop_minute: 0.3}
