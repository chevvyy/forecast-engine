name: lightgbm
family: gbdt
device: gpu
objective: quantile        # one model per quantile, or use multi-quantile wrapper
params:
  num_leaves: 63
  learning_rate: 0.03
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  min_data_in_leaf: 500
  lambda_l2: 1.0
  max_bin: 255
early_stopping_rounds: 200
search_space:              # consumed by Optuna
  num_leaves: {type: int, low: 15, high: 255, log: true}
  learning_rate: {type: float, low: 0.005, high: 0.1, log: true}
  min_data_in_leaf: {type: int, low: 50, high: 5000, log: true}
  feature_fraction: {type: float, low: 0.4, high: 1.0}
