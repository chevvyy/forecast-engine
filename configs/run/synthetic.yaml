# Offline smoke config: synthetic bars with a planted mean-reversion signal.
data:
  source: synthetic
  layer: adjusted
  timeframe: 1Min
  universe: configs/data/universe.yaml
  features: configs/features/v1.yaml
  subsample_every: 5
  synthetic: {n_symbols: 12, start: 2024-01-02, end: 2024-07-01, signal: 0.06, seed: 0}
eval:
  first_val_start: 2024-03-01
  val_block: 1M
  step: 1M
  embargo_min: 450
  final_holdout: 3W
  min_train_rows: 1000
tune:
  tasks: [rv_30, ret_30]
  trials_per_round: 6
  rounds: 2
  max_folds: 3
  device: cpu
  promote_alpha: 0.01
  min_rel_improvement: 0.002
  report_alpha: 0.05
  n_jobs: 2
