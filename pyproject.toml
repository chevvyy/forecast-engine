[project]
name = "forecast-engine"
version = "0.0.1"
description = "Minute-bar equity forecasting engine: returns + realized volatility as quantiles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Core of the training loop. Kept small on purpose so a fresh worker installs in minutes.
  "torch>=2.7",                # cu128+ wheels required for RTX 5070 Ti / sm_120
  "numpy>=2.0",
  "polars>=1.0",
  "pyyaml>=6.0",
  "onnx>=1.16",                # ONNX export for the phone tier
  "onnxruntime>=1.19",         # export parity check + CPU latency measurement
]

[project.optional-dependencies]
planned = [
  # Declared by the original scaffold for later phases; not imported by any code yet.
  "lightning>=2.4", "pyarrow>=17", "duckdb>=1.1", "exchange-calendars>=4.5", "alpaca-py>=0.30",
  "lightgbm>=4.5", "catboost>=1.2", "scikit-learn>=1.5", "statsmodels>=0.14", "optuna>=4.0",
  "mlflow>=2.16", "psycopg[binary]>=3.2", "hydra-core>=1.3", "pydantic>=2.8", "python-dotenv>=1.0",
  "fastapi>=0.115", "uvicorn>=0.30",
]
reference-models = [
  "neuralforecast>=1.7",       # PatchTST / N-HiTS / iTransformer / TSMixer reference impls
]
foundation = [
  "tirex-ts",                  # verify package name at install time
  "chronos-forecasting",
  # Kronos: install from https://github.com/shiyu-coder/Kronos
]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "ipykernel",
  # Reference splitter to cross-check ours (verify the PyPI name before adding; conda-forge has `purgedcv`):
  # "purgedcv @ git+https://github.com/eslazarev/purged-cross-validation.git",
]

# PyTorch CUDA 12.8 index (Blackwell support). Bump to cu129/cu130 when you upgrade drivers.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "DTZ"]   # DTZ: forbid naive datetimes
ignore = ["N803", "N806", "N812", "E501", "E731"]                # math-style names (X, Q, L_model); long table rows

[tool.mypy]
strict = true
packages = ["forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "leakage: tests that guard against look-ahead (must never be skipped)",
  "gpu: requires a CUDA device",
  "network: hits an external API",
]
