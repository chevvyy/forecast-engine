[project]
name = "forecast-engine"
version = "0.0.1"
description = "Minute-bar equity forecasting engine: returns + realized volatility as quantiles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # --- deep learning (cu128+ wheels required for RTX 5070 Ti / sm_120) ---
  "torch>=2.7",
  "lightning>=2.4",            # optional trainer loop; plain PyTorch is fine too
  # --- data ---
  "polars>=1.0",
  "pyarrow>=17",
  "duckdb>=1.1",
  "exchange-calendars>=4.5",
  # --- market data ---
  "alpaca-py>=0.30",
  # --- classical ML / baselines ---
  "lightgbm>=4.5",
  "catboost>=1.2",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",         # HAR-RV, Diebold-Mariano helpers
  # --- experiment management ---
  "optuna>=4.0",
  "mlflow>=2.16",
  "psycopg[binary]>=3.2",
  "hydra-core>=1.3",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  # --- serving ---
  "fastapi>=0.115",
  "scipy>=1.13",               # binomial / t tests in evaluation
  "pyyaml>=6",                 # configs (hydra-core pulls it too; explicit because we import it)
  "uvicorn>=0.30",
]

[project.scripts]
fe-ingest = "forecast.cli:fe_ingest"
fe-dq = "forecast.cli:fe_dq"
fe-baselines = "forecast.cli:fe_baselines"
fe-autotune = "forecast.cli:fe_autotune"
fe-worker = "forecast.cli:fe_worker"
fe-holdout = "forecast.cli:fe_holdout"
fe-score = "forecast.cli:fe_score"
fe-serve = "forecast.cli:fe_serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[project.optional-dependencies]
reference-models = [
  "neuralforecast>=1.7",       # PatchTST / N-HiTS / iTransformer / TSMixer reference impls
]
foundation = [
  "tirex-ts",                  # verify package name at install time
  "chronos-forecasting",
  # Kronos: install from https://github.com/shiyu-coder/Kronos
]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "ipykernel",
  # Reference splitter to cross-check ours (verify the PyPI name before adding; conda-forge has `purgedcv`):
  # "purgedcv @ git+https://github.com/eslazarev/purged-cross-validation.git",
]

# PyTorch CUDA 12.8 index (Blackwell support). Bump to cu129/cu130 when you upgrade drivers.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "DTZ"]   # DTZ: forbid naive datetimes
# ML conventions: X / y / M (metrics) / E (experiment) / G (groups) are fine as names
ignore = ["N803", "N806", "N812", "N802"]

[tool.mypy]
strict = true
packages = ["forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "leakage: tests that guard against look-ahead (must never be skipped)",
  "gpu: requires a CUDA device",
  "network: hits an external API",
  "slow: end-to-end training checks (~1-3 min)",
]
filterwarnings = ["ignore::UserWarning"]
